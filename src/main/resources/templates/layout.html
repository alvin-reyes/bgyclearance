<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Barangay Business Clearance'">Barangay Business Clearance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5fae'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" th:href="@{/clearances}">Barangay Business Clearance</a>
    <a class="btn btn-primary" th:href="@{/clearances/new}" id="new-clearance">New clearance</a>
  </div>
</header>
<div th:fragment="flash" th:if="${message}" class="flash" role="status" id="flash" th:text="${message}">Saved.</div>
</body>
</html>
