<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head(${id == null} ? 'New clearance' : 'Edit clearance')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>
<main class="wrap">
  <a class="back" th:if="${id == null}" th:href="@{/clearances}">← All clearances</a>
  <a class="back" th:unless="${id == null}" th:href="@{/clearances/{id}(id=${id})}">← Back to clearance</a>
  <div class="page-head">
    <div>
      <h1 th:text="${id == null} ? 'New clearance' : 'Edit clearance'">New clearance</h1>
      <p class="muted">Fields marked <span class="req">*</span> are required.</p>
    </div>
  </div>

  <form th:object="${form}" method="post" novalidate data-guard
        th:action="${id == null} ? @{/clearances} : @{/clearances/{id}(id=${id})}">

    <div th:replace="~{fields :: error-summary}"></div>

    <fieldset class="card">
      <legend>Application</legend>
      <div class="field">
        <span class="label" id="type-label">Type</span>
        <div class="segmented" role="radiogroup" aria-labelledby="type-label">
          <label><input type="radio" th:field="*{type}" value="NEW"><span>New business</span></label>
          <label><input type="radio" th:field="*{type}" value="RENEWAL"><span>Renewal</span></label>
        </div>
      </div>
      <div class="grid-2">
        <div th:replace="~{fields :: text(name='controlNumber', label='Control no.', required=true, kind='int', maxlength=9,
             hint=${id == null and nextControlNumber != null}
                  ? 'Next available: <button type=&quot;button&quot; class=&quot;link-btn&quot; data-fill=&quot;controlNumber&quot; data-value=&quot;' + ${nextControlNumber} + '&quot;>' + ${nextControlNumber} + '</button>'
                  : null)}"></div>
        <div th:replace="~{fields :: text(name='issuedOn', label='Date issued', required=true, kind='date')}"></div>
      </div>
    </fieldset>

    <fieldset class="card">
      <legend>Business</legend>
      <div th:replace="~{fields :: text(name='businessName', label='Business name', required=true, maxlength=200,
           placeholder='As registered, e.g. Tindahan ni Mang Tomas')}"></div>
      <div th:replace="~{fields :: text(name='address', label='Address', maxlength=300, placeholder='Street, purok or sitio')}"></div>
      <div class="grid-2">
        <div th:replace="~{fields :: text(name='typeOfBusiness', label='Type of business / activity', maxlength=200,
             list='business-types', placeholder='e.g. Sari-sari store',
             hint=${#lists.isEmpty(businessTypes)} ? null : 'Start typing to reuse a previous entry.')}"></div>
        <div th:replace="~{fields :: text(name='capitalization', label='Capitalization', prefix='₱', maxlength=100, placeholder='e.g. 75,000')}"></div>
      </div>
      <datalist id="business-types">
        <option th:each="t : ${businessTypes}" th:value="${t}"></option>
      </datalist>
      <div class="field">
        <span class="label" id="building-label">Building</span>
        <div class="segmented" role="radiogroup" aria-labelledby="building-label">
          <label><input type="radio" th:field="*{building}" value="OWNED"><span>Owned</span></label>
          <label><input type="radio" th:field="*{building}" value="RENTED"><span>Rented</span></label>
          <label><input type="radio" name="building" value="" th:checked="*{building == null}"><span>Not stated</span></label>
        </div>
      </div>
    </fieldset>

    <fieldset class="card">
      <legend>Ownership</legend>
      <div class="field">
        <span class="label" id="kind-label">Kind <span class="hint">· select all that apply</span></span>
        <div class="chips" role="group" aria-labelledby="kind-label">
          <label class="chip"><input type="checkbox" th:field="*{corporation}"><span>Corporation</span></label>
          <label class="chip"><input type="checkbox" th:field="*{singleProprietorship}"><span>Single proprietorship</span></label>
          <label class="chip"><input type="checkbox" th:field="*{partnership}"><span>Partnership</span></label>
          <label class="chip"><input type="checkbox" th:field="*{otherOwnership}"><span>Others</span></label>
        </div>
      </div>
      <div th:replace="~{fields :: text(name='ownerName', label='Owner / manager', maxlength=200)}"></div>
    </fieldset>

    <fieldset class="card">
      <legend>Endorsement</legend>
      <div th:replace="~{fields :: text(name='applicantMemberOf', label='Applicant is a member of', maxlength=200, placeholder='e.g. Poblacion Homeowners Association')}"></div>
      <div class="grid-2">
        <div th:replace="~{fields :: text(name='hoaPresident', label='Homeowners’ association president', maxlength=200)}"></div>
        <div th:replace="~{fields :: text(name='secondEndorsementNumber', label='2nd endorsement no.', kind='int', maxlength=9)}"></div>
      </div>
    </fieldset>

    <fieldset class="card">
      <legend>Payment</legend>
      <div class="grid-2">
        <div th:replace="~{fields :: text(name='orNumber', label='O.R. no.', kind='int', maxlength=9, placeholder='Official receipt number')}"></div>
        <div th:replace="~{fields :: text(name='amountPaid', label='Amount paid', required=true, prefix='₱', kind='amount', maxlength=15, placeholder='0.00')}"></div>
      </div>
    </fieldset>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit" id="save">Save clearance</button>
      <a class="btn btn-link" th:href="${id == null} ? @{/clearances} : @{/clearances/{id}(id=${id})}">Cancel</a>
      <span class="dirty-note" aria-live="polite"></span>
    </div>
  </form>
</main>
</body>
</html>
