<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Settings')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>
<main class="wrap">
  <div th:replace="~{layout :: flash}"></div>
  <div class="page-head">
    <div>
      <h1>Settings</h1>
      <p class="muted">These details are printed in the letterhead and signature block of every clearance.</p>
    </div>
  </div>

  <form th:object="${form}" th:action="@{/settings}" method="post" novalidate data-guard>
    <div th:replace="~{fields :: error-summary}"></div>

    <fieldset class="card">
      <legend>Barangay</legend>
      <div th:replace="~{fields :: text(name='barangayName', label='Barangay name', required=true, maxlength=120,
           placeholder='e.g. San Isidro', hint='Without the word &quot;Barangay&quot;; it is added when printing.')}"></div>
      <div class="grid-2">
        <div th:replace="~{fields :: text(name='municipality', label='City / municipality', maxlength=120,
             placeholder='e.g. Municipality of Liloan', hint='Printed exactly as typed.')}"></div>
        <div th:replace="~{fields :: text(name='province', label='Province', maxlength=120, placeholder='e.g. Cebu')}"></div>
      </div>
    </fieldset>

    <fieldset class="card">
      <legend>Signatories</legend>
      <div class="grid-2">
        <div th:replace="~{fields :: text(name='punongBarangay', label='Punong barangay', required=true, maxlength=120,
             placeholder='e.g. Hon. Ramon Cruz')}"></div>
        <div th:replace="~{fields :: text(name='secretary', label='Barangay secretary', maxlength=120,
             hint='Optional. Adds a &quot;Prepared by&quot; signature line.')}"></div>
      </div>
    </fieldset>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit" id="save">Save settings</button>
      <span class="dirty-note" aria-live="polite"></span>
    </div>
  </form>
</main>
</body>
</html>
