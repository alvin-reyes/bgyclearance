<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Dashboard')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>
<main class="wrap">
  <div th:replace="~{layout :: flash}"></div>
  <div th:replace="~{layout :: setup-banner}"></div>

  <div class="page-head">
    <div>
      <span class="eyebrow" th:text="${barangay.configured} ? 'Barangay ' + ${barangay.barangayName} : 'Business clearances'">Barangay</span>
      <h1>Dashboard</h1>
      <p class="muted">Business clearances at a glance</p>
    </div>
  </div>

  <section class="stats" aria-label="Totals">
    <div class="card stat" id="stat-total">
      <div class="stat-label"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span><span>Clearances</span></div>
      <div class="stat-value" th:text="${#numbers.formatInteger(stats.total, 1, 'COMMA')}">0</div>
      <div class="stat-sub">all time</div>
    </div>
    <div class="card stat" id="stat-collected">
      <div class="stat-label"><span class="stat-icon gold" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V4h5.5a4.5 4.5 0 0 1 0 9H8M5 8h14M5 11h14"/></svg></span><span>Collected</span></div>
      <div class="stat-value" th:text="'₱' + ${#numbers.formatDecimal(stats.totalCollected, 1, 'COMMA', 2, 'POINT')}">₱0.00</div>
      <div class="stat-sub">all time</div>
    </div>
    <div class="card stat" id="stat-year">
      <div class="stat-label"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span><span th:text="'Issued in ' + ${stats.year}">Issued this year</span></div>
      <div class="stat-value" th:text="${#numbers.formatInteger(stats.yearCount, 1, 'COMMA')}">0</div>
      <div class="stat-sub" th:text="'₱' + ${#numbers.formatDecimal(stats.yearCollected, 1, 'COMMA', 2, 'POINT')} + ' collected'">₱0.00 collected</div>
    </div>
    <div class="card stat" id="stat-mix">
      <div class="stat-label"><span class="stat-icon violet" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.3A9 9 0 0 1 20.7 9H15z"/></svg></span><span>New vs. renewal</span></div>
      <div class="stat-value"><span th:text="${stats.newCount}">0</span> <span class="muted">/</span> <span th:text="${stats.renewalCount}">0</span></div>
      <div class="split" role="img" th:attr="aria-label=${stats.newCount} + ' new, ' + ${stats.renewalCount} + ' renewals'">
        <span class="s-new" th:style="'width:' + (${stats.total} == 0 ? 0 : ${stats.newCount * 100.0 / stats.total}) + '%'"></span>
        <span class="s-renewal" th:style="'width:' + (${stats.total} == 0 ? 0 : ${stats.renewalCount * 100.0 / stats.total}) + '%'"></span>
      </div>
      <div class="legend"><span><i class="dot dot-new"></i>New</span><span><i class="dot dot-renewal"></i>Renewal</span></div>
    </div>
  </section>

  <section class="card" aria-labelledby="recent-heading">
    <div class="card-head">
      <h2 id="recent-heading">Recently added</h2>
      <a th:href="@{/clearances}" th:if="${stats.total > 0}">View all</a>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(recent)}" id="empty">
      <p>No clearances yet.</p>
      <a class="btn btn-primary" th:href="@{/clearances/new}">Register the first one</a>
    </div>
    <ul class="recent" th:unless="${#lists.isEmpty(recent)}">
      <li th:each="c : ${recent}">
        <span class="avatar" aria-hidden="true" th:text="${c.initial()}">T</span>
        <div class="who">
          <a th:href="@{/clearances/{id}(id=${c.id})}" th:text="${c.displayName()}">Store</a>
          <span th:text="'Control no. ' + (${c.controlNumber} ?: '—') + (${c.issuedOn} ? ' · ' + ${#temporals.format(c.issuedOn, 'MMM d, yyyy')} : '')">Control no. 1001</span>
        </div>
        <span class="badge" th:classappend="${c.type.name() == 'NEW'} ? 'badge-new' : 'badge-renewal'" th:text="${c.type.label()}">New</span>
        <span class="num" th:text="'₱' + ${#numbers.formatDecimal(c.amountPaid, 1, 'COMMA', 2, 'POINT')}">₱0.00</span>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
