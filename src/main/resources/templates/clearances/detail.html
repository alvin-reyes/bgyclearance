<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head(${c.businessName})"></head>
<body>
<header th:replace="layout :: topbar"></header>
<main class="wrap">
  <div th:replace="layout :: flash"></div>
  <p><a th:href="@{/clearances}">← All clearances</a></p>

  <div class="page-head">
    <div>
      <h1 id="business-name" th:text="${c.businessName}">Business</h1>
      <p class="muted">
        Control no. <strong id="control-number" th:text="${c.controlNumber}">1001</strong>
        · <span class="badge" id="clearance-type" th:text="${c.forNew} ? 'New' : 'Renewal'">New</span>
      </p>
    </div>
    <div class="button-row">
      <a class="btn btn-primary" id="print" th:href="@{/clearances/{id}/report.pdf(id=${c.id})}" target="_blank" rel="noopener">Print clearance (PDF)</a>
      <a class="btn" id="edit" th:href="@{/clearances/{id}/edit(id=${c.id})}">Edit</a>
    </div>
  </div>

  <div class="card">
    <dl class="details">
      <dt>Address</dt><dd th:text="${#strings.defaultString(c.address, '—')}">—</dd>
      <dt>Type of business</dt><dd th:text="${#strings.defaultString(c.typeOfBusiness, '—')}">—</dd>
      <dt>Capitalization</dt><dd th:text="${#strings.defaultString(c.capitalization, '—')}">—</dd>
      <dt>Building</dt><dd th:text="${c.owned} ? 'Owned' : (${c.rented} ? 'Rented' : '—')">—</dd>
      <dt>Ownership</dt>
      <dd id="ownership-kinds" th:text="${#strings.isEmpty(ownershipKinds)} ? '—' : ${ownershipKinds}">—</dd>
      <dt>Owner / manager</dt><dd th:text="${#strings.defaultString(c.ownership, '—')}">—</dd>
      <dt>Applicant is a member of</dt><dd th:text="${#strings.defaultString(c.applicantMemberOf, '—')}">—</dd>
      <dt>Homeowners' association president</dt><dd th:text="${#strings.defaultString(c.assocHomeOwnerPresident, '—')}">—</dd>
      <dt>2nd endorsement no.</dt><dd th:text="${#strings.defaultString(c.secondEndorsmentNumber, '—')}">—</dd>
      <dt>OR no.</dt><dd th:text="${#strings.defaultString(c.orNumber, '—')}">—</dd>
      <dt>Amount paid</dt><dd id="amount-paid" th:text="${#numbers.formatDecimal(c.amountPaid, 1, 'COMMA', 2, 'POINT')}">0.00</dd>
    </dl>
  </div>

  <form class="danger-zone" th:action="@{/clearances/{id}/delete(id=${c.id})}" method="post"
        onsubmit="return confirm('Delete this clearance? This cannot be undone.');">
    <button class="btn btn-danger" type="submit" id="delete">Delete clearance</button>
  </form>
</main>
</body>
</html>
