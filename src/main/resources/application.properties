# Database: a single SQLite file. Override with -DDB_LOCATION=/path/to/file.db
# (or the DB_LOCATION environment variable). Created on first start.
spring.datasource.url=jdbc:sqlite:${DB_LOCATION:clearances.db}?busy_timeout=5000
# SQLite allows one writer at a time; one pooled connection keeps it simple and safe.
spring.datasource.hikari.maximum-pool-size=1

# Listen on this computer only. Use --server.address=0.0.0.0 to allow the local network.
server.address=127.0.0.1
server.port=8080
server.servlet.session.tracking-modes=cookie
server.error.whitelabel.enabled=false

spring.main.banner-mode=off
spring.thymeleaf.cache=true
