# Web app (com.thub.areyes1.web.WebApplication). Ignored by the desktop app.
# Listen on this machine only; set server.address=0.0.0.0 to allow other computers on the LAN.
server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off
# Keep session ids out of URLs.
server.servlet.session.tracking-modes=cookie
