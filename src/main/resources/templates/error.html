<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${status == 404} ? 'Not found' : 'Error'">Error</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="wrap">
  <div class="page-head"><h1 th:text="${status == 404} ? 'Not found' : 'Something went wrong'">Something went wrong</h1></div>
  <div class="card card-body">
    <p th:if="${status == 404}">That page or clearance doesn't exist. It may have been deleted.</p>
    <p th:unless="${status == 404}">The request could not be completed. Check that the database file is reachable and try again.</p>
    <p class="muted" th:text="${status} + ' ' + ${error}">500 Internal Server Error</p>
  </div>
  <p><a th:href="@{/clearances}">← All clearances</a></p>
</main>
</body>
</html>
