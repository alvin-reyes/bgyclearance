<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="${title} + ' · Business Clearance'">Business Clearance</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<header class="topbar" th:fragment="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" th:href="@{/}">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="9" fill="#1c3f8f"/>
        <g fill="#e5b64c"><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(0 17 17)"/><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(45 17 17)"/><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(90 17 17)"/><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(135 17 17)"/><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(180 17 17)"/><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(225 17 17)"/><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(270 17 17)"/><rect x="16.1" y="4.6" width="1.8" height="5.2" rx=".9" transform="rotate(315 17 17)"/><circle cx="17" cy="17" r="5.1"/></g>
        <circle cx="17" cy="17" r="2.2" fill="#1c3f8f"/>
      </svg>
      <span>
        <span class="brand-title">Business Clearance</span>
        <span class="brand-sub" th:text="${barangay.configured} ? 'Barangay ' + ${barangay.barangayName} : 'Barangay registry'">Barangay registry</span>
      </span>
    </a>
    <nav class="nav" aria-label="Main">
      <a th:href="@{/}" th:classappend="${section == 'dashboard'} ? 'active'" th:attr="aria-current=${section == 'dashboard'} ? 'page'">Dashboard</a>
      <a th:href="@{/clearances}" th:classappend="${section == 'clearances'} ? 'active'" th:attr="aria-current=${section == 'clearances'} ? 'page'">Clearances</a>
      <a th:href="@{/settings}" th:classappend="${section == 'settings'} ? 'active'" th:attr="aria-current=${section == 'settings'} ? 'page'">Settings</a>
    </nav>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <a class="btn btn-primary" th:href="@{/clearances/new}" id="new-clearance">New<span class="long"> clearance</span></a>
    </div>
  </div>
</header>

<div th:fragment="flash" th:if="${message}" class="flash" role="status" id="flash" th:text="${message}">Saved.</div>

<div th:fragment="setup-banner" th:unless="${barangay.configured}" class="notice" id="setup-banner">
  <strong>Set up your barangay.</strong>
  Enter the barangay name and punong barangay so they appear on printed clearances.
  <a th:href="@{/settings}">Open settings</a>
</div>

</body>
</html>
